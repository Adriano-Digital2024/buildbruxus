# Configuração do Cloudflare Pages para o BuildBruxus.
# As Functions usam apenas fetch + Web Crypto (sem SDK do Stripe),
# então não precisamos de nodejs_compat.

name = "buildbruxus"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Observação: o build command (npm run build) ainda precisa ser definido no
# dashboard do Cloudflare Pages → Settings → Builds & deployments → Build configurations.